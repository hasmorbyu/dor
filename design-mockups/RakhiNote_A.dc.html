<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap">
  <style>
    :root { --paper:#FBF3E7; --marigold:#F2A03D; --maroon:#8C2F2B; --ink:#2B2420; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100%; background:#e2ddd0; display:flex; align-items:center; justify-content:center; padding:28px; font-family:'Quicksand',sans-serif; color:var(--ink); }
    .frame { position:relative; width:340px; }
    .card { position:relative; background:var(--paper); border-radius:6px; box-shadow:0 14px 34px rgba(0,0,0,.16); overflow:hidden; padding:40px 34px 34px; min-height:660px; }
    .stitch { position:absolute; inset:9px; pointer-events:none; }
    .kicker { position:relative; z-index:2; font-family:'Quicksand',sans-serif; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--maroon); opacity:.65; font-weight:700; margin-bottom:26px; text-align:center; }
    .letter { position:relative; z-index:2; font-family:'Caveat',cursive; font-size:21px; line-height:1.55; color:var(--ink); }
    .line { margin:0 0 6px; }
    .w1 { max-width:88%; } .w2 { max-width:96%; } .w3 { max-width:70%; } .w4 { max-width:92%; } .w5 { max-width:80%; }
    .sig { text-align:right; font-size:25px; margin-top:26px; color:var(--maroon); }
    .rule { border:none; border-top:1px solid var(--marigold); opacity:.4; margin:40px 0 20px; position:relative; z-index:2; }
    .continue-wrap { position:relative; z-index:2; text-align:center; }
    .continue { display:inline-block; font-family:'Quicksand',sans-serif; font-weight:700; font-size:13px; letter-spacing:.04em; color:var(--maroon); border:1.5px solid var(--maroon); border-radius:999px; padding:9px 22px; opacity:.4; }
    .continue-note { font-family:'Caveat',cursive; font-size:14px; color:var(--maroon); opacity:.6; margin-top:8px; }
  </style>
</helmet>
<div class="frame">
  <div class="card">
    <svg class="stitch" viewBox="0 0 322 642" preserveAspectRatio="none" fill="none">
      <rect x="1" y="1" width="320" height="640" rx="5" stroke="var(--marigold)" stroke-width="2" stroke-dasharray="7 6"/>
      <rect x="1" y="1" width="320" height="640" rx="5" stroke="var(--maroon)" stroke-width="2" stroke-dasharray="7 6" stroke-dashoffset="6.5"/>
    </svg>

    <div class="kicker">A Note</div>
    <div class="letter">
      <div class="line w1">[opening line — Part 2]</div>
      <div class="line w2">[line — Part 2]</div>
      <div class="line w3">[line — Part 2]</div>
      <div class="line w4">[line — Part 2]</div>
      <div class="line w2">[line — Part 2]</div>
      <div class="line w5">[line — Part 2]</div>
      <div class="line w4">[closing line — Part 2]</div>
      <div class="sig">[signature — Part 2]</div>
    </div>

    <hr class="rule"/>
    <div class="continue-wrap">
      <div class="continue">Continue</div>
      <div class="continue-note">(appears once you've read a while)</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
