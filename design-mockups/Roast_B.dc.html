<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Quicksand:wght@400;500;600;700&display=swap">
  <style>
    :root { --paper:#F4F1E8; --paper-line:#D8D2C0; --blue:#6E8CA0; --maroon:#7A2E2A; --marigold:#E8A33D; --ink:#332E28; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100%; background:#e2ddd0; display:flex; align-items:center; justify-content:center; padding:28px; font-family:'Quicksand',sans-serif; color:var(--ink); }
    .frame { position:relative; width:420px; }
    .card { position:relative; background:var(--paper); border-radius:10px; box-shadow:0 22px 46px rgba(0,0,0,.2), 0 2px 0 rgba(0,0,0,.05); transform:rotate(-1deg); overflow:hidden; padding:22px 20px 26px; min-height:600px; }
    .rule-lines { position:absolute; inset:0; pointer-events:none; background-image:repeating-linear-gradient(to bottom, transparent 0 30px, var(--paper-line) 30px 31px); opacity:.5; }
    .tape { position:absolute; width:58px; height:22px; top:-9px; right:34px; background:repeating-linear-gradient(45deg, rgba(255,255,255,.3) 0 5px, rgba(255,255,255,.05) 5px 10px), var(--blue); opacity:.8; transform:rotate(6deg); box-shadow:0 2px 5px rgba(0,0,0,.15); z-index:3; }
    .thread { position:relative; z-index:2; width:100%; height:34px; margin-bottom:16px; }
    .kicker { position:relative; z-index:2; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--maroon); opacity:.7; font-weight:700; margin-bottom:4px; text-align:center; }
    h1 { position:relative; z-index:2; font-family:'Permanent Marker',cursive; font-weight:400; font-size:24px; line-height:1.15; color:var(--maroon); margin:0 0 4px; text-align:center; }
    .sub { position:relative; z-index:2; font-family:'Quicksand',sans-serif; font-style:italic; font-weight:500; font-size:12.5px; color:var(--ink); opacity:.65; text-align:center; margin:0 0 14px; }
    .stage { position:relative; z-index:2; height:420px; }
    .center-char { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); width:150px; z-index:2; }
    .sticker { position:absolute; z-index:3; background:var(--paper); border:2px solid var(--maroon); border-radius:9px; padding:8px 11px; font-size:12px; font-weight:600; line-height:1.25; box-shadow:0 6px 14px rgba(0,0,0,.13); max-width:118px; }
    .s1 { left:2px; top:18px; transform:rotate(-7deg); background:#fff; }
    .s2 { right:0px; top:0px; transform:rotate(5deg); border-color:var(--blue); color:var(--blue); }
    .s3 { right:-6px; top:190px; transform:rotate(-4deg); }
    .s4 { left:-4px; top:270px; transform:rotate(6deg); border-color:var(--blue); color:var(--blue); }
    .s5 { left:120px; top:352px; transform:rotate(-3deg); background:#fff; }
    .tapbadge { position:absolute; right:-8px; top:-8px; width:22px; height:22px; border-radius:50%; background:var(--maroon); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.2); }
    .tapbadge svg { width:12px; height:12px; }
    .hint { position:absolute; left:50%; bottom:2px; transform:translateX(-50%); font-family:'Quicksand',sans-serif; font-style:italic; font-weight:600; font-size:11.5px; color:var(--maroon); opacity:.7; }
  </style>
</helmet>
<div class="frame">
  <div class="card">
    <div class="rule-lines"></div>
    <div class="tape"></div>

    <svg class="thread" viewBox="0 0 380 40" preserveAspectRatio="none" fill="none">
      <path d="M-6,20 C6,3 26,3 38,20 C50,37 70,37 82,20 C94,3 114,3 126,20 C138,37 158,37 170,20 C182,3 202,3 214,20 C226,37 246,37 258,20 C270,3 290,3 302,20 C314,37 334,37 346,20 C358,3 378,3 386,15" stroke="var(--marigold)" stroke-width="3" stroke-linecap="round" transform="translate(0,3)"/>
      <path d="M-6,20 C6,3 26,3 38,20 C50,37 70,37 82,20 C94,3 114,3 126,20 C138,37 158,37 170,20 C182,3 202,3 214,20 C226,37 246,37 258,20 C270,3 290,3 302,20 C314,37 334,37 346,20 C358,3 378,3 386,15" stroke="var(--maroon)" stroke-width="3" stroke-linecap="round" transform="translate(0,-3)"/>
      <circle cx="126" cy="20" r="7.5" fill="none" stroke="var(--maroon)" stroke-width="2.5"/>
      <circle cx="123" cy="17" r="2" fill="var(--maroon)"/>
      <circle cx="258" cy="20" r="5.5" fill="var(--marigold)" stroke="var(--maroon)" stroke-width="1.5"/>
    </svg>

    <div class="kicker">The Roast</div>
    <h1>[roast headline — Part 2]</h1>
    <div class="sub">[narrator setup line — Part 2]</div>

    <div class="stage">
      <div class="sticker s1">"[roast label 1 — Part 2]"</div>
      <div class="sticker s2">"[roast label 2 — Part 2]"
        <div class="tapbadge"><svg viewBox="0 0 24 24" fill="none"><path d="M9 12.5V6a2 2 0 1 1 4 0v5M13 6a2 2 0 1 1 4 0v6M17 8.5a2 2 0 1 1 4 0V15c0 4-3 7-7 7h-1c-3 0-4.5-1-6-3l-3.2-4.6c-.6-1 0-2.4 1.2-2.5 .7 0 1.3.3 1.7.9L9 15" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="sticker s3">"[roast label 3 — Part 2]"</div>
      <div class="sticker s4">"[roast label 4 — Part 2]"</div>
      <div class="sticker s5">"[roast label 5 — Part 2]"</div>

      <svg class="center-char" viewBox="0 0 150 170" fill="none">
        <path d="M50,160 C44,124 38,110 56,98 C44,92 40,74 56,68" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".85"/>
        <path d="M44,112 C18,100 12,80 27,66" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M96,110 C122,94 128,72 114,60" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M58,152 L48,170 M80,152 L94,170" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="72" cy="56" r="34" stroke="var(--maroon)" stroke-width="4" fill="var(--paper)"/>
        <path d="M56,48 L64,52 M88,48 L80,52" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
        <ellipse cx="72" cy="70" rx="9" ry="7" fill="var(--maroon)"/>
      </svg>
      <div class="hint">[tap a label to reveal — Part 2]</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
