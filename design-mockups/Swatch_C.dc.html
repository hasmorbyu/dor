<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Quicksand:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100%; background:#e2ddd0; display:flex; align-items:center; justify-content:center; padding:24px; font-family:'Quicksand',sans-serif; }
    a { color:#7A2321; } a:hover { color:#EF4B3A; }
    .card { position:relative; width:332px; background:#FFF8EC; border-radius:8px; box-shadow:0 16px 36px rgba(0,0,0,.18); transform:rotate(-1deg); padding:26px 24px 22px; }
    .tape { position:absolute; width:60px; height:22px; top:-10px; right:30px; background:repeating-linear-gradient(45deg, rgba(255,255,255,.3) 0 5px, rgba(255,255,255,.05) 5px 10px), #F6C445; opacity:.9; transform:rotate(6deg); box-shadow:0 2px 5px rgba(0,0,0,.15); }
    h1 { font-family:'Permanent Marker',cursive; font-weight:400; font-size:22px; color:#7A2321; margin:0 0 2px; }
    .sub { font-size:12px; color:#231F1B; opacity:.65; margin:0 0 18px; }
    .row { display:flex; align-items:center; gap:12px; padding:7px 0; border-bottom:1px solid #f0e6d0; }
    .row:last-child { border-bottom:none; }
    .swab { width:34px; height:34px; border-radius:6px; flex:0 0 auto; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
    .meta { display:flex; flex-direction:column; gap:1px; }
    .tok { font-size:12px; font-weight:700; color:#231F1B; }
    .use { font-size:11px; color:#231F1B; opacity:.6; }
    .hex { margin-left:auto; font-size:11px; font-family:monospace; color:#231F1B; opacity:.55; }
  </style>
</helmet>
<div class="card">
  <div class="tape"></div>
  <h1>Direction C</h1>
  <div class="sub">Crayon Box — louder, chaotic-kid-energy; sincerity beats must fight for contrast</div>

  <div class="row"><div class="swab" style="background:#FFF8EC"></div><div class="meta"><div class="tok">paper</div><div class="use">background</div></div><div class="hex">#FFF8EC</div></div>
  <div class="row"><div class="swab" style="background:#EF4B3A"></div><div class="meta"><div class="tok">crayon-red</div><div class="use">primary accent</div></div><div class="hex">#EF4B3A</div></div>
  <div class="row"><div class="swab" style="background:#F6C445"></div><div class="meta"><div class="tok">crayon-yellow</div><div class="use">secondary accent</div></div><div class="hex">#F6C445</div></div>
  <div class="row"><div class="swab" style="background:#4C9A6A"></div><div class="meta"><div class="tok">crayon-green</div><div class="use">tertiary accent, sparing</div></div><div class="hex">#4C9A6A</div></div>
  <div class="row"><div class="swab" style="background:#7A2321"></div><div class="meta"><div class="tok">maroon</div><div class="use">headlines, thread</div></div><div class="hex">#7A2321</div></div>
  <div class="row"><div class="swab" style="background:#231F1B"></div><div class="meta"><div class="tok">ink</div><div class="use">body text</div></div><div class="hex">#231F1B</div></div>
</div>
</x-dc>
</body>
</html>
