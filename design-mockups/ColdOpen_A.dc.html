<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Quicksand:wght@400;500;600;700&display=swap">
  <style>
    :root { --paper:#FBF3E7; --paper-line:#E8D9BE; --marigold:#F2A03D; --maroon:#8C2F2B; --accent:#E14B3D; --leaf:#5C7A4E; --ink:#2B2420; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100%; background:#e2ddd0; display:flex; align-items:center; justify-content:center; padding:12px; font-family:'Quicksand',sans-serif; color:var(--ink); }
    a { color:var(--maroon); } a:hover { color:var(--marigold); }
    .frame { position:relative; width:340px; }
    .card { position:relative; background:var(--paper); border-radius:10px; box-shadow:0 10px 24px rgba(0,0,0,.16); transform:rotate(-0.8deg); overflow:hidden; padding:22px 22px 30px; min-height:560px; display:flex; flex-direction:column; }
    .rule-lines { position:absolute; inset:0; pointer-events:none; background-image:repeating-linear-gradient(to bottom, transparent 0 30px, var(--paper-line) 30px 31px); opacity:.5; }
    .tape { position:absolute; width:58px; height:22px; top:-9px; left:22px; background:repeating-linear-gradient(45deg, rgba(255,255,255,.3) 0 5px, rgba(255,255,255,.05) 5px 10px), var(--marigold); opacity:.85; transform:rotate(-7deg); box-shadow:0 2px 5px rgba(0,0,0,.15); z-index:3; }
    .thread { position:relative; z-index:2; width:100%; height:34px; margin-bottom:26px; }
    .kicker { position:relative; z-index:2; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--maroon); opacity:.7; font-weight:700; margin-bottom:6px; }
    h1 { position:relative; z-index:2; font-family:'Permanent Marker',cursive; font-weight:400; font-size:30px; line-height:1.15; color:var(--maroon); margin:0 0 10px; }
    .sub { position:relative; z-index:2; font-size:13px; color:var(--ink); opacity:.7; margin:0 0 auto; max-width:26ch; }
    .stage { position:relative; z-index:2; flex:1; }
    .buttons { position:relative; z-index:2; display:flex; align-items:flex-end; justify-content:space-between; margin-top:28px; }
    .btn { font-family:'Quicksand',sans-serif; font-weight:700; font-size:15px; border-radius:999px; padding:13px 26px; border:none; cursor:pointer; }
    .btn.primary { background:var(--accent); color:#fff; box-shadow:0 6px 0 rgba(0,0,0,.12); transform:rotate(-1deg); }
    .btn.dodge { background:transparent; color:var(--maroon); border:2.5px solid var(--maroon); transform:rotate(7deg) translate(6px,-4px); opacity:.9; }
    .note { position:absolute; right:4px; bottom:74px; z-index:3; font-family:'Quicksand',sans-serif; font-style:italic; font-weight:600; font-size:12px; color:var(--maroon); transform:rotate(-6deg); width:100px; text-align:right; line-height:1.2; }
    .note svg { display:block; margin:2px 0 0 auto; }
    .character { position:absolute; left:-26px; bottom:26px; z-index:4; width:118px; }
    .taglabel { position:absolute; left:64px; bottom:6px; z-index:5; font-family:'Quicksand',sans-serif; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--maroon); background:var(--paper); border:1.5px dashed var(--maroon); border-radius:5px; padding:2px 5px; opacity:.85; transform:rotate(-4deg); }
  </style>
</helmet>
<div class="frame">
  <div class="card">
    <div class="rule-lines"></div>
    <div class="tape"></div>

    <svg class="thread" viewBox="0 0 320 40" preserveAspectRatio="none" fill="none">
      <path d="M-6,20 C4,5 24,5 34,20 C44,35 64,35 74,20 C84,5 104,5 114,20 C124,35 144,35 154,20 C164,5 184,5 194,20 C204,35 224,35 234,20 C244,5 264,5 274,20 C284,35 304,35 314,20 L326,20" stroke="var(--marigold)" stroke-width="3" stroke-linecap="round" transform="translate(0,3)"/>
      <path d="M-6,20 C4,5 24,5 34,20 C44,35 64,35 74,20 C84,5 104,5 114,20 C124,35 144,35 154,20 C164,5 184,5 194,20 C204,35 224,35 234,20 C244,5 264,5 274,20 C284,35 304,35 314,20 L326,20" stroke="var(--maroon)" stroke-width="3" stroke-linecap="round" transform="translate(0,-3)"/>
      <path d="M-6,20 L-16,12 M-6,20 L-18,20 M-6,20 L-15,29" stroke="var(--maroon)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M326,20 L336,12 M326,20 L338,20 M326,20 L335,29" stroke="var(--marigold)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>

    <div class="kicker">Cold Open</div>
    <h1>[headline —<br/>Part 2]</h1>
    <div class="sub">[one line of narrator setup — Part 2]</div>

    <div class="stage"></div>

    <div class="buttons">
      <button class="btn primary">Open it</button>
      <button class="btn dodge">Not yet</button>
    </div>
    <div class="note">(dodges your<br/>cursor →)
      <svg width="34" height="20" viewBox="0 0 34 20" fill="none"><path d="M2,3 C16,3 20,16 32,16" stroke="currentColor" stroke-width="1.6" fill="none" stroke-dasharray="1 4.5" stroke-linecap="round"/><path d="M27,12 L32,16 L26,18" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <svg class="character" viewBox="0 0 120 140" fill="none">
    <path d="M40,130 C35,100 30,90 45,80 C35,75 32,60 45,55" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none" opacity=".85"/>
    <path d="M35,92 C15,82 10,66 22,54" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M78,90 C100,76 104,58 92,48" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M48,125 L40,140 M64,125 L76,140" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="58" cy="46" r="27" stroke="var(--maroon)" stroke-width="3.5" fill="var(--paper)"/>
    <circle cx="49" cy="43" r="2.4" fill="var(--ink)"/>
    <circle cx="68" cy="43" r="2.4" fill="var(--ink)"/>
    <ellipse cx="58" cy="57" rx="7" ry="5.5" fill="var(--maroon)"/>
  </svg>
  <div class="taglabel">gif slot</div>
</div>
</x-dc>
</body>
</html>
